<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">interview-recall</title>
  <desc id="desc">一个对话气泡，里面是循环箭头和对勾，代表口述、复习和纠正</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- 图标：圆角方块 -->
  <rect x="12" y="12" width="136" height="136" rx="32" fill="url(#tile)"/>

  <!-- 对话气泡：口述 -->
  <path d="M44 42 h72 a14 14 0 0 1 14 14 v42 a14 14 0 0 1 -14 14 h-38 l-18 16 v-16 h-16 a14 14 0 0 1 -14 -14 v-42 a14 14 0 0 1 14 -14 z" fill="#FFFFFF"/>

  <!-- 循环箭头：间隔复习 -->
  <path d="M100 77 a20 20 0 1 1 -6.5 -14.7" fill="none" stroke="url(#arc)" stroke-width="7" stroke-linecap="round"/>
  <path d="M86.5 56.5 l11 4.5 l-4 11.5 z" fill="#EA580C"/>

  <!-- 对勾：纠错后讲对 -->
  <path d="M71 77 l6.5 6.5 l12 -13" fill="none" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 文字 -->
  <text x="176" y="88" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1">
    <tspan fill="#2563EB">interview</tspan><tspan fill="#9CA3AF">-</tspan><tspan fill="#EA580C">recall</tspan>
  </text>
  <text x="178" y="122" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#6B7280" letter-spacing="2">SPEAK · CORRECT · RECALL</text>
</svg>
